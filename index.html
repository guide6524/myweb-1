<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>SweetMoment Cake Shop</title>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff8f0;
      text-align: center;
    }
    header {
      background-color: #ff6f61;
      color: white;
      padding: 20px;
    }
    .products {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px;
      flex-wrap: wrap;
    }
    .cake {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 220px;
      padding: 20px;
    }
    .cake img {
      width: 100%;
      border-radius: 10px;
    }
    .ad-text {
      margin: 30px 0;
      font-size: 1.4em;
      color: #d84315;
      font-weight: bold;
    }
    .presenter {
      margin: 40px 0;
    }
    footer {
      background-color: #ffe4e1;
      padding: 20px;
    }
    footer img {
      height: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>SweetMoment เค้กแห่งความสุขทุกคำ</h1>
  </header>

  <div class="products">
    <div class="cake">
      <img src="strawberry-cake.jpg" alt="เค้กสตรอว์เบอร์รี่">
      <h3>เค้กสตรอว์เบอร์รี่</h3>
      <p>฿450</p>
    </div>
    <div class="cake">
      <img src="chocolate-cake.jpg" alt="เค้กช็อกโกแลต">
      <h3>เค้กช็อกโกแลตเข้มข้น</h3>
      <p>฿390</p>
    </div>
    <div class="cake">
      <img src="cheesecake.jpg" alt="ชีสเค้ก">
      <h3>ชีสเค้กญี่ปุ่นนุ่มละมุน</h3>
      <p>฿420</p>
    </div>
  </div>

  <div class="ad-text">
    🍓 โปรโมชั่นพิเศษ! ซื้อครบ 1,000 บาท รับฟรีเค้กมินิ 1 ชิ้น 🍰
  </div>

  <div class="presenter">
    <img src="https://example.com/lisa.jpg" alt="Lisa Blackpink" width="200">
    <p>พรีเซนเตอร์สุดน่ารักของเรา: <strong>ลิซ่า BLACKPINK</strong></p>
  </div>

  <footer>
    <img src="https://example.com/logo.png" alt="โลโก้ SweetMoment">
    <p>&copy; 2025 SweetMoment Cake Shop</p>
  </footer>

</script>
</body>
</html>
